[project]
name = "tutor"
version = "0.1.0"
description = "Personal study tutor: Moodle connector, memory and planning."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "mcp>=2.0",
    "beautifulsoup4>=4.12",
    "tzdata",
]

[project.scripts]
tutor = "tutor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
